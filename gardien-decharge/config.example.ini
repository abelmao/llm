# Copier ce fichier en config.ini puis remplir les valeurs.
# chmod 600 config.ini  (le mot de passe est en clair dedans)

[prise]
# Adresse IP locale de la prise Shelly (fixer un bail DHCP dans la box).
adresse = http://192.168.1.50
# En dessous de cette puissance (watts), on considère que le chargeur
# ne tire plus rien : ordinateur sur batterie ou prise coupée.
# Vérifier avec : python3 gardien.py --mesure (chargeur branché, ordi allumé).
seuil_watts = 2.0
# Fréquence de mesure.
intervalle_secondes = 30
# Nombre de mesures identiques consécutives avant d'alerter
# (3 x 30 s = alerte au bout de ~1 min 30, évite les fausses alertes).
confirmations = 3

[email]
# Exemple Gmail : créer un « mot de passe d'application » sur
# https://myaccount.google.com/apppasswords (nécessite la validation en 2 étapes).
smtp_hote = smtp.gmail.com
smtp_port = 587
utilisateur = mon.adresse@gmail.com
mot_de_passe = xxxx xxxx xxxx xxxx
destinataire = mon.adresse@gmail.com
