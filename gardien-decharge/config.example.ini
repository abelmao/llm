# Copier ce fichier en config.ini puis remplir les valeurs.
# chmod 600 config.ini  (le mot de passe est en clair dedans)

[surveillance]
# ping   : le Pi écoute le PC sur le réseau (rien à installer nulle part)
# balise : le PC envoie sa batterie au Pi (script utilisateur, sans admin)
# prise  : puissance du chargeur via une prise connectée Shelly
mode = ping
# Fréquence de mesure et nombre de mesures identiques consécutives avant
# d'alerter (3 x 30 s = alerte au bout de ~1 min 30, évite les fausses alertes).
intervalle_secondes = 30
confirmations = 3

[pc]
# Mode ping : IP (ou nom) du PC sur le réseau local.
# Fixer un bail DHCP statique dans la box si possible.
adresse = 192.168.1.60

[balise]
# Mode balise : port d'écoute sur le Pi (le même que dans balise.ps1 / balise.sh).
port = 8642
# En dessous de ce pourcentage de batterie, alerte « batterie faible ».
seuil_batterie = 20
# Sans nouvelle balise pendant ce délai, alerte « plus de nouvelles du PC ».
silence_secondes = 300

[prise]
# Mode prise : adresse IP locale de la prise Shelly.
adresse = http://192.168.1.50
# En dessous de cette puissance (watts), le chargeur ne tire plus rien.
# Vérifier avec : python3 gardien.py --mesure (chargeur branché, ordi allumé).
seuil_watts = 2.0

[email]
# Exemple Gmail : créer un « mot de passe d'application » sur
# https://myaccount.google.com/apppasswords (nécessite la validation en 2 étapes).
smtp_hote = smtp.gmail.com
smtp_port = 587
utilisateur = mon.adresse@gmail.com
mot_de_passe = xxxx xxxx xxxx xxxx
destinataire = mon.adresse@gmail.com
